<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procedural Galaxy Generator</title>
<meta name="description" content="A deterministic 3D galaxy, star system, planet and surface generator. Every universe is a pure function of one 48-bit seed.">
<!--
  Procedural Galaxy Generator — single-file build
  25 modules, 252 kB of source, no external assets.
  Every galaxy, star, planet, faction and terrain patch in here is derived
  from one 48-bit universe seed. Nothing is fetched and nothing is stored.
  Built: from src/ by build.mjs
-->
<style>
/* =====================================================================
 * style.css — dark instrument-panel UI
 * ---------------------------------------------------------------------
 * Two typographic registers on purpose: a normal UI face for prose and a
 * monospace face for anything that is a number or a seed, so the panels
 * read as instrumentation rather than as a web page. Panels are floating
 * translucent slabs so the galaxy stays visible behind them.
 * ===================================================================== */

:root {
  --bg: #04060d;
  --panel: rgba(9, 14, 25, 0.74);
  --panel-solid: #0a1020;
  --line: rgba(120, 170, 220, 0.15);
  --line-soft: rgba(120, 170, 220, 0.08);
  --text: #d3e2f6;
  --dim: #7d93b0;
  --dimmer: #55677f;
  --accent: #57e3ff;
  --accent2: #a98bff;
  --good: #4dffa6;
  --warn: #ffd166;
  --bad: #ff6b6b;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--ui);
  font-size: 13px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#gx-app { position: fixed; inset: 0; }

#gx-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

#gx-fade {
  position: absolute; inset: 0;
  background: #04060d;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease;
  z-index: 40;
}
#gx-fade.on { opacity: 1; }

/* --- top bar ---------------------------------------------------------- */

#gx-top {
  position: absolute; top: 0; left: 0; right: 0;
  height: 52px;
  display: flex; align-items: center; gap: 18px;
  padding: 0 16px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(4, 6, 13, 0.85), rgba(4, 6, 13, 0));
  pointer-events: none;
}
#gx-top > * { pointer-events: auto; }

.brand {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--dim);
  white-space: nowrap;
}
.brand b { color: var(--accent); font-weight: 600; }

#gx-breadcrumb {
  display: flex; align-items: center; gap: 4px;
  flex: 1; min-width: 0;
  overflow: hidden;
}
#gx-breadcrumb .sep { color: var(--dimmer); padding: 0 2px; }
.crumb {
  background: none; border: 1px solid transparent; border-radius: 6px;
  color: var(--text); font: inherit; cursor: pointer;
  padding: 3px 8px; text-align: left; line-height: 1.15;
  display: flex; flex-direction: column; gap: 1px;
  max-width: 190px; white-space: nowrap;
}
.crumb:hover:not([disabled]) { background: rgba(87, 227, 255, 0.09); border-color: var(--line); }
.crumb[disabled] { cursor: default; }
.crumb.active .cl { color: var(--accent); }
.crumb .cl { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.crumb .cs {
  font-family: var(--mono); font-size: 9px; color: var(--dimmer);
  letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis;
}

#gx-top-actions { display: flex; gap: 6px; }
#gx-top-actions button {
  background: rgba(15, 24, 40, 0.7); border: 1px solid var(--line);
  color: var(--dim); border-radius: 6px; cursor: pointer;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  padding: 6px 10px; text-transform: uppercase;
}
#gx-top-actions button:hover { color: var(--accent); border-color: var(--accent); }

/* --- panels ----------------------------------------------------------- */

.panel {
  position: absolute;
  background: var(--panel);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line);
  border-radius: 10px;
  z-index: 15;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(120, 170, 220, 0.25) transparent;
}
.panel::-webkit-scrollbar { width: 8px; }
.panel::-webkit-scrollbar-thumb { background: rgba(120, 170, 220, 0.22); border-radius: 8px; }

#gx-left { top: 58px; left: 12px; width: 268px; bottom: 12px; padding: 4px 0 10px; }
#gx-right { top: 58px; right: 12px; width: 300px; bottom: 12px; padding: 4px 0 10px; }

.group, .card { border-bottom: 1px solid var(--line-soft); padding: 10px 13px 12px; }
.group:last-child, .card:last-child { border-bottom: none; }
.group h3, .card h3 {
  margin: 0 0 9px; font-family: var(--mono);
  font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--dimmer); font-weight: 500;
}
.group .body, .card .body { display: flex; flex-direction: column; gap: 7px; }

/* seed */
.seedrow { display: flex; gap: 6px; }
input.seed {
  flex: 1; min-width: 0;
  background: rgba(4, 8, 16, 0.8); border: 1px solid var(--line);
  border-radius: 6px; color: var(--accent);
  font-family: var(--mono); font-size: 14px; letter-spacing: 0.10em;
  padding: 7px 9px; text-transform: uppercase;
}
input.seed:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(87, 227, 255, 0.12); }
button.icon {
  width: 32px; background: rgba(15, 24, 40, 0.8); border: 1px solid var(--line);
  border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1;
}
button.icon:hover { color: var(--accent); border-color: var(--accent); }

p.note {
  margin: 2px 0 0; font-size: 11px; color: var(--dim); line-height: 1.45;
}
p.note code, code {
  font-family: var(--mono); font-size: 10.5px;
  background: rgba(87, 227, 255, 0.10); color: var(--accent);
  padding: 1px 4px; border-radius: 3px;
}

/* segmented */
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.seg {
  background: rgba(15, 24, 40, 0.6); border: 1px solid var(--line);
  color: var(--dim); border-radius: 6px; cursor: pointer;
  font: inherit; font-size: 11.5px; padding: 7px 6px; text-align: center;
}
.seg:hover { color: var(--text); border-color: rgba(120, 170, 220, 0.35); }
.seg.on {
  background: rgba(87, 227, 255, 0.14); border-color: var(--accent); color: var(--accent);
}

/* sliders */
label.slider { display: block; }
label.slider.disabled { opacity: 0.35; pointer-events: none; }
.sl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.sl .k { font-size: 11.5px; color: var(--dim); }
.sl .sv { font-family: var(--mono); font-size: 11px; color: var(--text); }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 16px; background: transparent; cursor: ew-resize; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 3px; background: rgba(120, 170, 220, 0.22); border-radius: 3px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px;
  border-radius: 50%; background: var(--accent); border: none;
  box-shadow: 0 0 10px rgba(87, 227, 255, 0.6);
}
input[type=range]::-moz-range-track { height: 3px; background: rgba(120, 170, 220, 0.22); border-radius: 3px; }
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px; border: none; border-radius: 50%; background: var(--accent);
}

/* presets + toggles + mini buttons */
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.preset {
  background: rgba(169, 139, 255, 0.10); border: 1px solid rgba(169, 139, 255, 0.28);
  color: #c8b6ff; border-radius: 6px; cursor: pointer; font: inherit; font-size: 11px; padding: 6px 4px;
}
.preset:hover { background: rgba(169, 139, 255, 0.2); color: #fff; }

.toggles { display: flex; flex-direction: column; gap: 5px; }
.toggle {
  display: flex; align-items: center; gap: 8px;
  background: none; border: 1px solid var(--line); border-radius: 6px;
  color: var(--dim); cursor: pointer; font: inherit; font-size: 11.5px;
  padding: 6px 8px; text-align: left;
}
.toggle i {
  width: 22px; height: 12px; border-radius: 7px; flex: none;
  background: rgba(120, 170, 220, 0.2); position: relative; transition: background 0.15s;
}
.toggle i::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--dim);
  transition: transform 0.15s, background 0.15s;
}
.toggle.on { color: var(--accent); border-color: rgba(87, 227, 255, 0.4); }
.toggle.on i { background: rgba(87, 227, 255, 0.32); }
.toggle.on i::after { transform: translateX(10px); background: var(--accent); }

.viewbtns { display: flex; gap: 5px; }
button.mini {
  flex: 1; background: rgba(15, 24, 40, 0.7); border: 1px solid var(--line);
  border-radius: 6px; color: var(--dim); cursor: pointer;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em;
  padding: 6px 4px; text-transform: uppercase; white-space: nowrap;
}
button.mini:hover { color: var(--accent); border-color: var(--accent); }

button.primary {
  display: block; width: calc(100% - 26px); margin: 12px 13px;
  background: linear-gradient(180deg, rgba(87, 227, 255, 0.22), rgba(87, 227, 255, 0.10));
  border: 1px solid rgba(87, 227, 255, 0.5); border-radius: 7px;
  color: #dffaff; cursor: pointer; font: inherit; font-size: 12px; padding: 9px;
  letter-spacing: 0.03em;
}
button.primary:hover { background: rgba(87, 227, 255, 0.3); }

p.credit {
  margin: 12px 13px 4px; font-size: 10.5px; color: var(--dimmer); line-height: 1.5;
}
p.credit b { color: var(--dim); }

/* --- inspector rows --------------------------------------------------- */

.row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.row .k { color: var(--dim); font-size: 11.5px; flex: none; }
.row .v { font-family: var(--mono); font-size: 11px; text-align: right; }

.seedline {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 4px; padding-top: 7px; border-top: 1px dashed var(--line-soft);
}
.seedline .k {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--dimmer);
}

.bar { flex: 1; height: 4px; background: rgba(120, 170, 220, 0.14); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }

p.hint {
  margin: 10px 13px; font-size: 11px; color: var(--dim); line-height: 1.5;
  border-left: 2px solid rgba(87, 227, 255, 0.35); padding-left: 9px;
}
p.hint b { color: var(--text); }
p.anomaly { margin: 4px 0 0; font-size: 11px; color: var(--warn); }
p.name { margin: 0 0 6px; font-size: 11.5px; color: var(--dim); line-height: 1.45; }

.census .hist { display: flex; align-items: center; gap: 6px; }
.census .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.census .hk { font-family: var(--mono); font-size: 10px; width: 20px; color: var(--text); }
.census .hn { font-size: 10.5px; color: var(--dim); width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.census .hv { font-family: var(--mono); font-size: 9.5px; color: var(--dim); width: 34px; text-align: right; }

.factions .faction {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: 1px solid transparent; border-radius: 6px;
  color: var(--text); cursor: pointer; font: inherit; padding: 5px 6px; text-align: left;
}
.factions .faction:hover { background: rgba(120, 170, 220, 0.08); border-color: var(--line); }
.factions .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.factions .fn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.factions .fn b { font-size: 11.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.factions .fn span { font-size: 9.5px; color: var(--dimmer); }
.factions .bar { max-width: 42px; }

.starhead { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
.starhead .orb { width: 26px; height: 26px; border-radius: 50%; flex: none; }
.starhead b { display: block; font-size: 13px; font-weight: 500; }
.starhead span { font-family: var(--mono); font-size: 10px; color: var(--dim); }

.planets .planetrow {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: none; border: 1px solid transparent; border-radius: 6px;
  color: var(--text); cursor: pointer; font: inherit; padding: 5px 6px; text-align: left;
}
.planets .planetrow:hover { background: rgba(120, 170, 220, 0.09); border-color: var(--line); }
.planets .planetrow.hab { background: rgba(77, 255, 166, 0.05); }
.planets .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; box-shadow: inset -3px -2px 4px rgba(0, 0, 0, 0.55); }
.planets .pn { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.planets .pn b { font-size: 11.5px; font-weight: 500; }
.planets .pn span { font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
.habpill {
  font-family: var(--mono); font-size: 9.5px; color: var(--good);
  border: 1px solid rgba(77, 255, 166, 0.4); border-radius: 20px; padding: 1px 6px; flex: none;
}
.habrow { display: flex; align-items: center; gap: 8px; }
.habrow .k { color: var(--dim); font-size: 11.5px; }
.habrow .v { font-family: var(--mono); font-size: 10.5px; width: 34px; text-align: right; }

pre.json {
  margin: 0; padding: 9px 10px;
  background: rgba(4, 8, 16, 0.7); border: 1px solid var(--line-soft); border-radius: 6px;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: #9ff0d0;
  overflow-x: auto;
}

.trade .routes { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.trade .route { display: flex; flex-direction: column; gap: 1px; border-left: 2px solid var(--line); padding-left: 7px; }
.trade .rn { font-size: 10.5px; }
.trade .rr { font-family: var(--mono); font-size: 9px; color: var(--accent2); }
.trade .rv { font-family: var(--mono); font-size: 9px; color: var(--dim); }

/* --- system-view labels ---------------------------------------------- */

#gx-labels { position: absolute; inset: 0; pointer-events: none; z-index: 12; display: none; }
.gx-label {
  position: absolute; top: 0; left: 0;
  pointer-events: auto; cursor: pointer;
  background: rgba(6, 12, 22, 0.66); border: 1px solid var(--line);
  border-left: 2px solid rgba(87, 227, 255, 0.6);
  border-radius: 4px; padding: 2px 7px 3px;
  font-size: 10.5px; line-height: 1.3; white-space: nowrap;
  backdrop-filter: blur(4px);
}
.gx-label:hover { border-color: var(--accent); background: rgba(10, 22, 38, 0.9); }
.gx-label b { font-family: var(--mono); color: var(--accent); font-weight: 500; margin-right: 4px; }
.gx-label span { display: block; font-family: var(--mono); font-size: 9px; color: var(--dim); }
.gx-label.hab { border-left-color: var(--good); }
.gx-label.hab b { color: var(--good); }

/* --- tooltip / toast / loader ---------------------------------------- */

#gx-tooltip {
  position: fixed; top: 0; left: 0; z-index: 30;
  background: rgba(6, 12, 22, 0.9); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 8px; pointer-events: none;
  opacity: 0; transition: opacity 0.12s;
  font-size: 11px; line-height: 1.35; max-width: 220px;
}
#gx-tooltip.on { opacity: 1; }
#gx-tooltip b { display: block; color: var(--text); }
#gx-tooltip i { display: block; font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--accent); }
#gx-tooltip u { display: block; text-decoration: none; font-family: var(--mono); font-size: 9px; color: var(--dimmer); }

#gx-toast {
  position: absolute; bottom: 20px; left: 50%; z-index: 35;
  transform: translate(-50%, 12px);
  background: rgba(8, 16, 28, 0.94); border: 1px solid var(--line);
  border-radius: 7px; padding: 9px 15px;
  font-size: 12px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  max-width: 60vw; text-align: center;
}
#gx-toast.on { opacity: 1; transform: translate(-50%, 0); }

#gx-loader {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 38; display: flex; align-items: center; gap: 11px;
  background: rgba(6, 12, 22, 0.8); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 18px;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
#gx-loader.on { opacity: 1; }
#gx-loader span { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
#gx-loader .spin {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid rgba(87, 227, 255, 0.22); border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --- dev panel -------------------------------------------------------- */

#gx-dev {
  position: absolute; left: 292px; right: 324px; bottom: 12px;
  max-height: 46vh;
  background: var(--panel); backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 10px;
  z-index: 18; display: none; flex-direction: column;
  overflow: hidden;
}
#gx-dev.on { display: flex; }
#gx-dev header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-bottom: 1px solid var(--line-soft);
  flex: none;
}
#gx-dev header b {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent); font-weight: 500;
}
#gx-dev header .spacer { flex: 1; }
#gx-dev header button.mini { flex: none; }
button.x {
  background: none; border: none; color: var(--dim);
  cursor: pointer; font-size: 19px; line-height: 1; padding: 0 4px;
}
button.x:hover { color: var(--bad); }

.devbody {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(252px, 1fr));
  gap: 0; overflow-y: auto; padding: 2px 0 6px;
}
.devcol { padding: 9px 12px; border-right: 1px solid var(--line-soft); }
.devcol h4 {
  margin: 0 0 7px; font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--dimmer); font-weight: 500;
}
.devcol .rows { display: flex; flex-direction: column; gap: 3px; }
.kv { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kv .k {
  font-size: 10.5px; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kv .v { font-family: var(--mono); font-size: 10px; color: var(--text); text-align: right; }
.kv.warn .v { color: var(--warn); }
.kv.ok .v { color: var(--good); }
.kv.head { border-bottom: 1px solid var(--line-soft); padding-bottom: 3px; margin-bottom: 2px; }
.kv.head .k, .kv.head i {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--dimmer); font-style: normal;
}
.v3 { display: flex; gap: 7px; }
.v3 i {
  font-family: var(--mono); font-size: 9.5px; font-style: normal;
  color: var(--text); width: 46px; text-align: right; flex: none;
}
.v3 i:nth-child(2), .v3 i:nth-child(3) { color: var(--dim); }

.tree .tnode { display: flex; align-items: baseline; gap: 6px; font-size: 10px; }
.tree .tb { color: var(--dimmer); font-family: var(--mono); }
.tree .tk {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--dim); width: 52px; flex: none;
}
.tree code { font-size: 10px; }
.tree .tl {
  font-size: 9.5px; color: var(--dimmer); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
p.devnote {
  grid-column: 1 / -1; margin: 4px 12px 2px;
  font-size: 10px; color: var(--dimmer); line-height: 1.5;
  border-top: 1px solid var(--line-soft); padding-top: 7px;
}

/* --- help modal ------------------------------------------------------- */

#gx-help {
  position: absolute; inset: 0; z-index: 45;
  background: rgba(2, 4, 9, 0.72);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
}
#gx-help.on { display: flex; }
#gx-help .sheet {
  position: relative;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 12px; padding: 26px 30px 30px;
  max-width: 560px; max-height: 82vh; overflow-y: auto;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
}
#gx-help h2 {
  margin: 0 0 12px; font-size: 19px; font-weight: 500; letter-spacing: -0.01em;
}
#gx-help h3 {
  margin: 20px 0 7px; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 500;
}
#gx-help p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.6; color: var(--dim); }
#gx-help ul { margin: 0; padding-left: 18px; }
#gx-help li { font-size: 12.5px; line-height: 1.75; color: var(--dim); }
#gx-help b { color: var(--text); }
#gx-help .x { position: absolute; top: 12px; right: 14px; font-size: 24px; }

/* --- responsive ------------------------------------------------------- */

@media (max-width: 1180px) {
  #gx-dev { left: 12px; right: 12px; }
}
@media (max-width: 900px) {
  #gx-left, #gx-right { width: 232px; }
  #gx-left { bottom: 46vh; }
  #gx-right { bottom: 46vh; }
  .brand { display: none; }
}
@media (max-width: 680px) {
  #gx-right { display: none; }
  #gx-left { width: 210px; bottom: 12px; }
}

</style>

/* =====================================================================
 * gen/system.js — Phase 2: star systems
 * ---------------------------------------------------------------------
 * A system is addressed by its star's index in the galaxy point cloud.
 * That index is the *only* thing that has to be remembered to revisit a
 * system: seed = deriveIndex(galaxySeed, TAG.STAR, index), and everything
 * else falls out of that. This is why a URL like
 *
 *     #seed=7F8A-2C91-BD44&view=system&star=118427
 *
 * is enough to send someone to the exact same star you are looking at.
 *

 * belong. Periods come from Kepler's third law.

  var SYL_A = ['Ka', 'Tar', 'Vel', 'Zan', 'Mor', 'Ish', 'Nyx', 'Ora', 'Bel', 'Cyn', 'Dra', 'El', 'Fen', 'Gal', 'Hel', 'Ith', 'Jor', 'Kri', 'Lum', 'Mal'];

      index: index,
      seed: seed,
      name: name,
      star: star,
      planets: planets,
      belt: belt,
      position: pos,
      distanceFromCore: Math.sqrt(pos.x * pos.x + pos.y * pos.y + pos.z * pos.z),
      sector: sectorCoords,
      faction: faction,
      settled: settled,
      population: population,
      habitableCount: habitable.length,
      marginalCount: marginal.length,

    var s = build(index);
    return {
      index: s.index,
      seed: s.seed,
      name: s.name,
      class: s.star.class,
      className: s.star.className,
      color: s.star.colorHex,
      planets: s.planets.length,
      habitable: s.habitableCount,

      population: s.population,

    cacheStats: function () { return cacheStats; },
    cacheSize: function () { return cache.size; },

/* =====================================================================
 * gen/sector.js — Phase 6: spatial partitioning and sector streaming
 * ---------------------------------------------------------------------
 * A galaxy is two levels of detail, not one:
 *
 *   LOD 0  the point cloud. Every star, position + colour + size only.
 *          One GPU buffer, generated once, ~14 bytes per star.
 *   LOD 1  sector detail. Systems, planets, owners, economy. Expensive
 *          (kilobytes per system), so it is generated on demand for the
 *          sectors near the camera and discarded again under pressure.
 *

 * anything and without consulting its neighbours. Eviction is therefore
 * free of consequences — which is the property that makes streaming safe.

/* =====================================================================
 * gen/economy.js — Phase 8: production, demand and trade lanes
 * ---------------------------------------------------------------------
 * Deliberately a *model*, not a simulation: no tick loop, no state. Given
 * a sector's systems, production and demand are computed from what those
 * systems physically are, prices come from the supply/demand ratio, and
 * lanes are a greedy matching of surplus to shortfall weighted by
 * distance. All of it is a pure function of the sector seed, so evicting
 * a sector and reloading it reproduces the same economy exactly.
 *
 * Supply chain (the reason resources have tiers):
 *     ore + volatiles → goods → data / crystal

 * makes the lanes point somewhere interesting instead of at random.
 * ===================================================================== */

    return GX.perf.time('economy.sector', function () {
      var rng = GX.rng.make(GX.rng.derive(sectorSeed, 'economy'));
      var production = {}, demand = {};

      for (i = 0; i < systems.length; i++) {
        var s = systems[i];
        var pop = Math.max(0, s.population || 0);
        var popScale = pop > 0 ? Math.log10(1 + pop) / 3 : 0.15;

        for (k in s.resources) {
          if (!Object.prototype.hasOwnProperty.call(s.resources, k)) continue;
          production[k] = (production[k] || 0) + s.resources[k] * (0.5 + popScale);
          // producing a refined good creates demand for its inputs
          var ins = INPUTS[k];
          if (ins) for (var q = 0; q < ins.length; q++) {
            demand[ins[q]] = (demand[ins[q]] || 0) + s.resources[k] * 0.8;
          }
        }
        if (s.settled) {
          demand.food = (demand.food || 0) + popScale * 1.4;
          demand.goods = (demand.goods || 0) + popScale * 1.1;
          demand.fuel = (demand.fuel || 0) + popScale * 0.5;
        }
      }

      // prices: scarcity premium, clamped so nothing goes silly
      var prices = {};
      for (k in BASE_PRICE) {
        if (k === 'none') continue;
        var sup = production[k] || 0, dem = demand[k] || 0;
        var ratio = (dem + 0.6) / (sup + 0.6);
        prices[k] = Math.round(BASE_PRICE[k] * Math.max(0.35, Math.min(3.2, ratio)) * 100) / 100;

      var buyers = systems.filter(function (s) { return s.settled; });
      if (!buyers.length && hub) buyers = [hub];

      for (i = 0; i < sellers.length && routes.length < 18; i++) {
        var seller = sellers[i];
        var res = Object.keys(seller.resources)[0];

          var buyer = buyers[b];

          var dx = buyer.position.x - seller.position.x;
          var dy = buyer.position.y - seller.position.y;
          var dz = buyer.position.z - seller.position.z;
          var d = Math.sqrt(dx * dx + dy * dy + dz * dz);

 *               lights masked to the dark side, molten glow for lava worlds
 *   clouds      separate shell at 1.012 R, rotating faster than the ground

 *               atmospheric composition (N₂ → blue, CO₂ → ochre,
 *               CH₄ → orange), the outer is a wide soft haze

    '  gl_Position = projectionMatrix * viewMatrix * wp;',

    '  float lambert = max(0.0, ndl);',

    '  diffuse += alb.rgb * vec3(1.0, 0.45, 0.18) * dawn * 0.22 * uAtmoDensity;',

/* =====================================================================
 * ui/inspector.js — contextual detail panel
 * ---------------------------------------------------------------------
 * Shows whatever level you are standing on. Two rules it follows:
 *
 *  - always display the seed of the current node, in hex. It is the thing
 *    that makes the whole universe reproducible, so it should never be
 *    more than one glance away.
 *  - always show real units next to compressed visuals (AU for orbits,
 *    km for radii, K and °C for temperature), because the renderer lies
 *    about scale on purpose and the numbers should not.
 * ===================================================================== */
(function (GX) {
  'use strict';

  var h = GX.dom.h, clear = GX.dom.clear, row = GX.dom.row, bar = GX.dom.bar, fmt = GX.dom.fmt;

    host = document.getElementById('gx-right');

    var m = mult || 1;
    return 'rgb(' + Math.round(Math.min(255, c[0] * 255 * m)) + ',' +
      Math.round(Math.min(255, c[1] * 255 * m)) + ',' +
      Math.round(Math.min(255, c[2] * 255 * m)) + ')';

      h('span.k', { text: label }),
      h('code', { text: GX.seed.hex(seed) })

  function render() {
    if (!host) return;
    var st = GX.app.state();

    var sec = st.sector;

    host.appendChild(card(typeName + ' galaxy', [
      row('Universe', st.code),

      row('Sectors', GX.sectors.GRID + ' × ' + GX.sectors.GRID + '  (' +

      row('Resident', GX.sectors.loadedKeys().length + ' / ' + GX.sectors.CAPACITY +
        '  (' + (sstats.hits + sstats.misses ? Math.round(sstats.hits / (sstats.hits + sstats.misses) * 100) : 0) + '% hit)'),
      seedLine('galaxy seed', g.seed)

    // stellar census
    var types = GX.star.types();
    var total = g.count;
    var rows = [];
    for (var i = 0; i < types.length; i++) {
      var n = g.histogram[i];
      if (!n) continue;
      var c = GX.star.blackbodyRGB((types[i].temp[0] + types[i].temp[1]) / 2);
      rows.push(h('div.hist', null, [
        h('span.sw', { style: { background: rgbCss(c, 1.2) } }),
        h('span.hk', { text: types[i].key }),
        h('span.hn', { text: types[i].name }),
        bar(n / total, rgbCss(c, 1.1)),
        h('span.hv', { text: (n / total * 100).toFixed(1) + '%' })

    host.appendChild(card('Stellar census', rows, 'census'));

    if (sec) {
      host.appendChild(card('Sector ' + sec.sx + ':' + sec.sy, [
        h('p.name', { text: sec.name }),
        row('Stars', fmt.int(sec.starCount)),
        row('Detailed', sec.detailCount + ' systems'),
        row('Owner', sec.faction ? h('span.v', {
          text: sec.faction.name, style: { color: sec.faction.css }

  /* --- system ---------------------------------------------------------- */

  function renderSystem(st) {

    host.appendChild(card(sys.name, [
      h('div.starhead', null, [
        h('span.orb', { style: { background: s.colorHex, boxShadow: '0 0 22px ' + s.colorHex } }),

          h('span', { text: 'class ' + s.class + (s.exotic ? ' · remnant' : '') })

      row('Mass', s.mass.toFixed(2) + ' M☉'),
      row('Luminosity', s.luminosity < 0.01 ? s.luminosity.toExponential(2) + ' L☉' : s.luminosity.toFixed(2) + ' L☉'),
      row('Habitable zone', s.exotic ? '—' : s.habitable[0].toFixed(2) + ' – ' + s.habitable[1].toFixed(2) + ' AU'),

    if (sys.faction) {
      host.appendChild(card('Allegiance', [
        row('Polity', h('span.v', { text: sys.faction.name, style: { color: sys.faction.css } })),
        row('Government', sys.faction.government),
        row('Tech level', sys.faction.techName),

        sys.planets.map(function (p) {
          return h('button.planetrow' + (p.habitability > 0.55 ? '.hab' : ''), {
            onclick: function () { GX.app.openPlanet(p.ordinal); },

        row('Yield', sys.belt.resource)
      ]));
    }

    var sec = st.sector;
    if (sec && sec.economy && sec.economy.routes.length) {
      host.appendChild(card('Trade in this sector', [
        row('Character', sec.economy.classification),
        sec.economy.tariff !== null ? row('Tariff', sec.economy.tariff + '%') : null,
        h('div.routes', null, sec.economy.routes.slice(0, 5).map(function (r) {
          return h('div.route', null, [
            h('span.rn', { text: r.fromName + ' → ' + r.toName }),
            h('span.rr', { text: r.resourceName }),

      row('Density', p.densityGcc.toFixed(2) + ' g/cm³'),

      row('Day', p.dayHours < 48 ? p.dayHours.toFixed(1) + ' h' : (p.dayHours / 24).toFixed(1) + ' days'),
      row('Year', p.periodYears < 1 ? (p.periodYears * 365.25).toFixed(1) + ' days' : p.periodYears.toFixed(2) + ' years'),
      row('Orbit', p.au.toFixed(3) + ' AU · e = ' + p.eccentricity.toFixed(3))
    ]));

      row('Temperature', Math.round(p.temperatureK) + ' K  (' + Math.round(p.temperatureC) + ' °C)'),

      row('Hydrosphere', Math.round(p.water) + '% surface water'),

/* =====================================================================
 * ui/devpanel.js — Phase 10: developer tools
 * ---------------------------------------------------------------------
 * The feature most procedural-generation demos skip, and the one an
 * interviewer will actually poke at. It answers three questions live:
 *
 *   where did this come from?   the seed derivation chain, in hex
 *   what did it cost?           per-stage generation timings, last/avg/max
 *   what is it doing now?       frame time, draw calls, cache behaviour,
 *                               whether generation is on a worker thread
 *
 * It only samples twice a second and only while open, so it cannot be the
 * reason the frame rate looks bad.
 * ===================================================================== */
(function (GX) {
  'use strict';

  var h = GX.dom.h, clear = GX.dom.clear, fmt = GX.dom.fmt;
  var host = null, body = null, timer = null, open = false;

  var TIMING_ORDER = [
    ['galaxy.generate', 'Galaxy generation'],
    ['galaxy.roundtrip', 'Galaxy round-trip'],
    ['galaxy.upload', 'GPU upload'],
    ['sector.index', 'Spatial index'],
    ['factions.generate', 'Faction seeding'],
    ['factions.grid', 'Voronoi grid'],
    ['sector.load', 'Sector detail'],
    ['economy.sector', 'Economy pass'],
    ['system.build', 'System build'],
    ['planet.texture', 'Planet texture bake'],
    ['pick', 'Star pick (250k proj.)']
  ];

  function init() {
    host = document.getElementById('gx-dev');
    clear(host);
    host.appendChild(h('header', null, [
      h('b', { text: 'Developer tools' }),
      h('span.spacer'),
      h('button.mini', { onclick: copyReport, title: 'Copy a text report to the clipboard' }, ['Copy report']),
      h('button.mini', { onclick: toggleRes, id: 'gx-res-btn' }, ['Texture 512²']),
      h('button.mini', { onclick: function () { GX.perf.reset(); render(); } }, ['Reset stats']),
      h('button.x', { text: '×', onclick: function () { toggle(false); } })
    ]));
    body = h('div.devbody');
    host.appendChild(body);
    render();
  }

  function toggle(on) {
    open = on === undefined ? !open : !!on;
    host.classList.toggle('on', open);
    if (open) {
      render();
      timer = setInterval(render, 500);
    } else {
      clearInterval(timer);
      timer = null;
    }
  }

  function toggleRes() {
    var cur = GX.planetTexture.resolution();
    var next = cur === 512 ? 1024 : 512;
    GX.planetTexture.resolution(next);
    document.getElementById('gx-res-btn').textContent = 'Texture ' + next + '²';
    GX.hud.toast('Planet texture resolution: ' + next + '² — re-enter a planet to rebake');
  }

  function col(title, rows, cls) {
    return h('div.devcol' + (cls ? '.' + cls : ''), null, [
      h('h4', null, [title]),
      h('div.rows', null, rows)
    ]);
  }

  function kv(k, v, cls) {
    return h('div.kv' + (cls ? '.' + cls : ''), null, [
      h('span.k', { text: k }), h('span.v', { text: String(v) })
    ]);
  }

  function render() {
    if (!body || !open) return;
    clear(body);

    /* --- seed derivation tree ---------------------------------------- */
    var chain = GX.seed.snapshot();
    var treeRows = chain.map(function (nodeInfo, i) {
      return h('div.tnode', { style: { paddingLeft: (i * 12) + 'px' } }, [
        h('span.tb', { text: i === 0 ? '●' : '└' }),
        h('span.tk', { text: nodeInfo.level }),
        h('code', { text: nodeInfo.hex }),
        nodeInfo.label ? h('span.tl', { text: nodeInfo.label }) : null
      ]);
    });
    body.appendChild(col('Seed derivation', treeRows.length ? treeRows : [kv('—', 'nothing generated')], 'tree'));

    /* --- frame ------------------------------------------------------- */
    var f = GX.perf.frame;
    var heap = GX.perf.heapMB();
    body.appendChild(col('Frame', [
      kv('FPS', f.fps ? f.fps.toFixed(0) : '–', f.fps && f.fps < 40 ? 'warn' : ''),
      kv('Frame time', fmt.ms(f.ms)),
      kv('Worst (0.5 s)', fmt.ms(f.worst)),
      kv('Draw calls', GX.perf.get('gl.calls')),
      kv('Points', fmt.int(GX.perf.get('gl.points'))),
      kv('Triangles', fmt.int(GX.perf.get('gl.triangles'))),
      kv('Geometries', GX.perf.get('gl.geometries')),
      kv('Textures', GX.perf.get('gl.textures')),
      kv('JS heap', heap === null ? 'unavailable' : heap.toFixed(1) + ' MB'),
      kv('Device pixel ratio', GX.stage.size().dpr.toFixed(2))
    ]));

    /* --- generation timings ------------------------------------------ */
    var timings = GX.perf.timings();
    var tRows = [h('div.kv.head', null, [
      h('span.k', { text: 'stage' }),
      h('span.v3', null, [h('i', { text: 'last' }), h('i', { text: 'avg' }), h('i', { text: 'max' })])
    ])];
    TIMING_ORDER.forEach(function (pair) {
      var t = timings[pair[0]];
      if (!t) return;
      tRows.push(h('div.kv', null, [
        h('span.k', { text: pair[1] }),
        h('span.v3', null, [
          h('i', { text: fmt.ms(t.last) }),
          h('i', { text: fmt.ms(t.avg) }),
          h('i', { text: fmt.ms(t.max) })
        ])
      ]));
    });
    body.appendChild(col('Generation cost', tRows, 'timings'));

    /* --- streaming and caches ---------------------------------------- */
    var s = GX.sectors.stats();
    var total = s.hits + s.misses;
    var sysCache = GX.system.cacheStats();
    body.appendChild(col('Streaming & caches', [
      kv('Worker', GX.genWorker.status() + ' (' + GX.genWorker.sourceKB().toFixed(1) + ' kB bundle)',
        GX.genWorker.status() === 'main' ? 'warn' : 'ok'),
      kv('Stale results dropped', GX.perf.get('gen.dropped')),
      kv('Sectors resident', GX.sectors.loadedKeys().length + ' / ' + GX.sectors.CAPACITY),
      kv('Sector hit rate', total ? Math.round(s.hits / total * 100) + '%  (' + s.hits + '/' + total + ')' : '–'),
      kv('Sector evictions', s.evictions),
      kv('Sector detail bytes', fmt.bytes(s.bytes)),
      kv('Systems cached', GX.system.cacheSize() + '  (' + sysCache.hits + ' hits, ' + sysCache.evictions + ' evicted)'),
      kv('Planet textures', GX.planetTexture.cacheSize() + ' resident, ' +
        GX.perf.get('texture.evictions') + ' evicted'),
      kv('Texture cache hits', GX.perf.get('texture.hits') + ' / ' +
        (GX.perf.get('texture.hits') + GX.perf.get('texture.misses')))
    ]));

    body.appendChild(h('p.devnote', {
      html: 'Generation runs off the main thread when workers are available; the bundle is ' +
        'assembled at runtime from the same function objects this thread uses, so both ' +
        'threads run byte-identical generator code. Stale slider results are discarded ' +
        'rather than rendered.'
    }));
  }

  function report() {
    var st = GX.app.state();
    var lines = [];
    lines.push('PROCEDURAL GALAXY — diagnostic report');
    lines.push('universe seed : ' + st.code);
    lines.push('root seed     : ' + GX.seed.hex(GX.seed.rootSeed(st.code)));
    lines.push('view          : ' + st.view);
    lines.push('params        : ' + JSON.stringify(st.params));
    lines.push('');
    lines.push('seed chain:');
    GX.seed.snapshot().forEach(function (n) {
      lines.push('  ' + n.level.padEnd(9) + ' ' + n.hex + (n.label ? '  ' + n.label : ''));
    });
    lines.push('');
    lines.push('timings (last / avg / max, ms):');
    var t = GX.perf.timings();
    Object.keys(t).forEach(function (k) {
      lines.push('  ' + k.padEnd(20) + t[k].last.toFixed(2) + ' / ' + t[k].avg.toFixed(2) + ' / ' + t[k].max.toFixed(2) + '  (n=' + t[k].n + ')');
    });
    lines.push('');
    lines.push('frame: ' + GX.perf.frame.fps.toFixed(1) + ' fps, ' +
      GX.perf.get('gl.calls') + ' draw calls, ' + fmt.int(GX.perf.get('gl.points')) + ' points');
    var s = GX.sectors.stats();
    lines.push('sectors: ' + GX.sectors.loadedKeys().length + ' resident, ' +
      s.hits + ' hits / ' + s.misses + ' misses, ' + s.evictions + ' evictions');
    lines.push('worker: ' + GX.genWorker.status());
    var heap = GX.perf.heapMB();
    if (heap !== null) lines.push('heap: ' + heap.toFixed(1) + ' MB');
    return lines.join('\n');
  }

  function copyReport() {
    var text = report();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        GX.hud.toast('Diagnostic report copied');
      }, function () { console.log(text); GX.hud.toast('Clipboard blocked — report logged to console'); });
    } else {
      console.log(text);
      GX.hud.toast('Report logged to console');
    }
  }

  GX.devpanel = {
    init: init,
    toggle: toggle,
    isOpen: function () { return open; },
    report: report
  };
})(window.GX = window.GX || {});

/* ==== src/app.js ======================================================== */
/* =====================================================================
 * app.js — state, navigation and the regeneration pipeline
 * ---------------------------------------------------------------------
 * Single source of truth for what the user is looking at, and the only
 * place that decides when generation happens. Everything else (views, UI
 * panels) reads state and reacts.
 *
 * The URL hash is a projection of state:
 *
 *   #seed=7F8A-2C91-BD44&type=barred&stars=220000&view=planet&star=118427&planet=2
 *
 * so any view in the app is a link. That is the whole point of building it
 * on deterministic derivation rather than stored data: state is small
 * enough to fit in a URL because the universe is not data, it is a
 * function.
 * ===================================================================== */
(function (GX) {
  'use strict';

  var state = {
    code: '',
    params: GX.galaxy.defaults(),
    factionCount: 9,
    galaxy: null,
    view: 'galaxy',
    starIndex: -1,
    system: null,
    planetOrdinal: -1,
    planet: null,
    surface: null,
    sector: null,
    // overlays start off: the first impression should be the galaxy itself
    overlays: { factions: false, trade: false, sectors: false },
    viewOpts: { starScale: 0.85, dustOpacity: 0.05, timeScale: 1 },
    busy: false
  };

  var views = {};
  var regenTimer = null;
  var lastWritten = '';
  var generation = 0;

  /* ---------------------------------------------------------------- hash */

  var HASH_KEYS = {
    type: ['type', String],
    stars: ['starCount', function (v) { return parseInt(v, 10); }],
    arms: ['armCount', function (v) { return parseInt(v, 10); }],
    tight: ['armTightness', parseFloat],
    spread: ['armSpread', parseFloat],
    core: ['coreDensity', parseFloat],
    radius: ['radius', parseFloat],
    thick: ['thickness', parseFloat],
    dust: ['dust', parseFloat]
  };

  function parseHash() {
    var raw = location.hash.replace(/^#/, '');
    if (!raw) return {};
    var out = {};
    raw.split('&').forEach(function (pair) {
      var i = pair.indexOf('=');
      if (i < 0) return;
      out[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
    });
    return out;
  }

  function applyHash() {
    var q = parseHash();
    if (q.seed) {
      var norm = GX.seed.normalise(q.seed);
      if (norm) state.code = norm.code;
    }
    Object.keys(HASH_KEYS).forEach(function (k) {
      if (q[k] === undefined) return;
      var target = HASH_KEYS[k][0], cast = HASH_KEYS[k][1];
      var v = cast(q[k]);
      if (typeof v === 'number' && isNaN(v)) return;
      state.params[target] = v;
    });
    if (q.fac !== undefined) state.factionCount = Math.max(0, Math.min(16, parseInt(q.fac, 10) || 0));
    if (q.ov !== undefined) {
      state.overlays.factions = q.ov.indexOf('f') >= 0;
      state.overlays.trade = q.ov.indexOf('t') >= 0;
      state.overlays.sectors = q.ov.indexOf('g') >= 0;
    }
    return q;
  }

  function writeHash() {
    var q = ['seed=' + state.code];
    Object.keys(HASH_KEYS).forEach(function (k) {
      var v = state.params[HASH_KEYS[k][0]];
      if (typeof v === 'number') v = Math.round(v * 1000) / 1000;
      q.push(k + '=' + v);
    });
    q.push('fac=' + state.factionCount);
    var ov = (state.overlays.factions ? 'f' : '') + (state.overlays.trade ? 't' : '') +
      (state.overlays.sectors ? 'g' : '');
    q.push('ov=' + (ov || '-'));
    if (state.view !== 'galaxy') q.push('view=' + state.view);
    if (state.starIndex >= 0) q.push('star=' + state.starIndex);
    if (state.planetOrdinal >= 0 && state.view !== 'system') q.push('planet=' + state.planetOrdinal);
    if (state.view === 'surface' && state.surface) {
      q.push('lat=' + state.surface.lat.toFixed(2));
      q.push('lon=' + state.surface.lon.toFixed(2));
    }
    // Compare-by-value rather than a timer flag: location.replace() fires
    // hashchange on a later task, and a setTimeout(0) guard loses that race
    // — which used to make every navigation regenerate the whole galaxy.
    lastWritten = '#' + q.join('&');
    if (location.hash !== lastWritten) location.replace(lastWritten);
  }

  /* -------------------------------------------------------- generation */

  function regenerate(then) {
    var myGen = ++generation;
    state.busy = true;
    GX.hud.loading(true, 'Generating galaxy…');

    var root = GX.seed.rootSeed(state.code);
    GX.seed.note('universe', root, state.code);
    var galaxySeed = GX.rng.derive(root, 'galaxy');
    GX.seed.note('galaxy', galaxySeed, state.params.type);
    GX.seed.clearBelow('galaxy');

    var params = {};
    Object.keys(state.params).forEach(function (k) { params[k] = state.params[k]; });
    params.seed = galaxySeed;

    return GX.genWorker.generateGalaxy(params).then(function (g) {
      if (myGen !== generation) return;            // superseded mid-flight
      g.seed = galaxySeed;
      g.params = g.params || params;
      state.galaxy = g;

      GX.system.bind(g);
      GX.sectors.build(g);
      GX.factions.generate(g, state.factionCount);

      views.galaxy.setData(g);
      views.galaxy.sizeScale(state.viewOpts.starScale);
      views.galaxy.dustOpacity(state.viewOpts.dustOpacity);
      views.galaxy.setOverlay('factions', state.overlays.factions);
      views.galaxy.setOverlay('sectors', state.overlays.sectors);
      views.galaxy.setOverlay('trade', state.overlays.trade);

      state.busy = false;
      GX.hud.loading(false);
      GX.controls.sync();
      GX.inspector.render();
      writeHash();
      if (then) then(g);
      return g;
    }).catch(function (err) {
      state.busy = false;
      GX.hud.loading(false);
      console.error('[app] generation failed', err);
      GX.hud.toast('Generation failed — see console');
    });
  }

  function scheduleRegen(debounce) {
    clearTimeout(regenTimer);
    if (!debounce) return regenerate();
    regenTimer = setTimeout(function () { regenerate(); }, 90);
  }

  /* -------------------------------------------------------- navigation */

  function breadcrumb() {
    var items = [{
      label: 'Galaxy',
      sub: state.code,
      active: state.view === 'galaxy',
      onClick: state.view === 'galaxy' ? null : function () { goTo('galaxy'); }
    }];
    if (state.sector) {
      items.push({
        label: 'Sector ' + state.sector.sx + ':' + state.sector.sy,
        sub: state.sector.name.split('·')[0].trim(),
        active: false,
        onClick: state.view === 'galaxy' ? null : function () { goTo('galaxy'); },
        title: 'Streamed sector — ' + GX.dom.fmt.int(state.sector.starCount) + ' stars'
      });
    }
    if (state.system) {
      items.push({
        label: state.system.name,
        sub: state.system.star.className,
        active: state.view === 'system',
        onClick: state.view === 'system' ? null : function () { goTo('system'); }
      });
    }
    if (state.planet) {
      items.push({
        label: GX.planet.ROMAN[state.planet.ordinal],
        sub: state.planet.className,
        active: state.view === 'planet',
        onClick: state.view === 'planet' ? null : function () { goTo('planet'); }
      });
    }
    if (state.view === 'surface' && state.surface) {
      items.push({
        label: 'Surface',
        sub: state.surface.lat.toFixed(0) + '°, ' + state.surface.lon.toFixed(0) + '°',
        active: true
      });
    }
    GX.hud.breadcrumb(items);
  }

  function afterNavigate() {
    breadcrumb();
    GX.inspector.render();
    writeHash();
  }

  function goTo(view, opts) {
    opts = opts || {};
    GX.hud.tooltip(null);          // a hover tip from another view is stale
    if (view === 'galaxy') {
      state.view = 'galaxy';
      GX.seed.clearBelow('galaxy');
      var reset = !!opts.reset;
      GX.stage.show('galaxy', { reset: reset }).then(function () {
        // Coming back up from a system, the camera is still buried inside the
        // disk. Pull back around the star we came from so there is context,
        // rather than either snapping to the whole galaxy or showing a void.
        if (!reset && state.starIndex >= 0 && state.galaxy) {
          var p = state.galaxy.positions, i = state.starIndex;
          views.galaxy.controls.flyTo({
            tx: p[i * 3], ty: p[i * 3 + 1], tz: p[i * 3 + 2],
            distance: state.galaxy.extent * 0.42, polar: 0.78
          }, 1.1);
        }
        afterNavigate();
      });
      return;
    }
    if (view === 'system') {
      if (!state.system) return;
      state.view = 'system';
      GX.seed.clearBelow('star');
      GX.stage.show('system', { system: state.system }).then(afterNavigate);
      return;
    }
    if (view === 'planet') {
      if (!state.planet) return;
      state.view = 'planet';
      GX.seed.clearBelow('planet');
      GX.hud.loading(true, 'Baking planet surface…');
      // yield a frame so the loader paints before the (blocking) bake
      setTimeout(function () {
        GX.stage.show('planet', {
          planet: state.planet, star: state.system.star, settled: state.system.settled
        }).then(function () {
          GX.hud.loading(false);
          views.planet.setTimeScale(state.viewOpts.timeScale);
          afterNavigate();
        });
      }, 30);
      return;
    }
    if (view === 'surface') {
      state.view = 'surface';
      GX.stage.show('surface', {
        planet: state.planet,
        star: state.system.star,
        textures: views.planet.textures(),
        lat: opts.lat, lon: opts.lon
      }).then(function () {
        state.surface = views.surface.info();
        afterNavigate();
      });
    }
  }

  function selectStar(index, animate) {
    if (index < 0 || !state.galaxy) return;
    state.starIndex = index;
    views.galaxy.select(index);
    var sys = GX.system.build(index);
    state.system = sys;
    state.planet = null;
    state.planetOrdinal = -1;
    state.surface = null;
    GX.seed.note('star', sys.seed, sys.name + ' · ' + sys.star.className);

    // make sure the sector containing this star is resident
    var c = GX.sectors.coordsAt(sys.position.x, sys.position.z);
    state.sector = GX.sectors.load(c.sx, c.sy);
    if (state.sector) GX.seed.note('sector', state.sector.seed, state.sector.name);

    if (animate === false) { goTo('system'); return; }
    views.galaxy.approach(index, function () { goTo('system'); });
  }

  function openPlanet(ordinal) {
    if (!state.system || !state.system.planets[ordinal]) return;
    state.planetOrdinal = ordinal;
    state.planet = state.system.planets[ordinal];
    GX.seed.note('planet', state.planet.seed, state.planet.name + ' · ' + state.planet.className);
    goTo('planet');
  }

  function openSurface(lat, lon) {
    if (!state.planet || state.planet.isGiant) return;
    if (lat === undefined) {
      // pick a deterministic but interesting latitude rather than 0,0
      var r = GX.rng.make(GX.rng.derive(state.planet.seed, 'defaulttile'));
      lat = r.range(-42, 42);
      lon = r.range(-180, 180);
    }
    GX.hud.loading(true, 'Generating terrain…');
    setTimeout(function () {
      goTo('surface', { lat: lat, lon: lon });
      GX.hud.loading(false);
    }, 30);
  }

  function up() {
    if (state.view === 'surface') goTo('planet');
    else if (state.view === 'planet') goTo('system');
    else if (state.view === 'system') goTo('galaxy');
  }

  /* --------------------------------------------------------- mutations */

  function setSeed(text) {
    var norm = GX.seed.normalise(text);
    if (!norm) return;
    if (norm.code === state.code) { GX.controls.sync(); return; }
    state.code = norm.code;
    resetHierarchy();
    if (!norm.literal) GX.hud.toast('"' + norm.source + '" → ' + norm.code);
    GX.controls.render();
    regenerate(function () { goTo('galaxy', { reset: true }); });
  }

  function randomSeed() {
    state.code = GX.seed.randomCode();
    resetHierarchy();
    GX.controls.render();
    regenerate(function () { goTo('galaxy', { reset: true }); });
  }

  function resetHierarchy() {
    state.starIndex = -1;
    state.system = null;
    state.planet = null;
    state.planetOrdinal = -1;
    state.surface = null;
    state.sector = null;
    views.galaxy.select(-1);
    GX.seed.clearBelow('universe');
  }

  function setParams(patch, transient) {
    var changed = false;
    Object.keys(patch).forEach(function (k) {
      if (state.params[k] !== patch[k]) { state.params[k] = patch[k]; changed = true; }
    });
    if (!changed) return;
    if (patch.type !== undefined) GX.controls.render();
    resetHierarchy();
    if (state.view !== 'galaxy') goTo('galaxy');
    scheduleRegen(transient);
  }

  function setFactionCount(n) {
    state.factionCount = n;
    GX.factions.generate(state.galaxy, n);
    GX.sectors.clear();
    GX.system.clear();
    views.galaxy.rebuildOverlays();
    state.sector = null;
    GX.inspector.render();
    writeHash();
  }

  function setOverlay(name, on) {
    state.overlays[name] = on;
    views.galaxy.setOverlay(name, on);
    writeHash();
  }

  function setViewOption(name, v) {
    state.viewOpts[name] = v;
    if (name === 'starScale') views.galaxy.sizeScale(v);
    if (name === 'dustOpacity') views.galaxy.dustOpacity(v);
    if (name === 'timeScale') {
      views.system.setTimeScale(v);
      views.planet.setTimeScale(v);
    }
  }

  function cameraPreset(which) {
    if (state.view !== 'galaxy') goTo('galaxy');
    if (which === 'top') views.galaxy.topDown();
    else if (which === 'edge') views.galaxy.edgeOn();
    else views.galaxy.home();
  }

  function flyToFaction(id) {
    var f = GX.factions.byId(id);
    if (!f) return;
    if (state.view !== 'galaxy') goTo('galaxy');
    views.galaxy.controls.flyTo({
      tx: f.home.x, ty: 0, tz: f.home.z,
      distance: state.galaxy.extent * 0.5, polar: 0.7
    }, 1.2);
    GX.hud.toast(f.name + ' — capital: ' + f.homeName + '. "' + f.motto + '"');
  }

  function copyLink() {
    writeHash();
    var url = location.href;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        GX.hud.toast('Link copied — it rebuilds this exact view');
      }, function () { GX.hud.toast('Clipboard blocked: ' + url); });
    } else {
      GX.hud.toast(url);
    }
  }

  /* --------------------------------------------------------- interaction */

  function wireGalaxyInteraction() {
    var v = views.galaxy;
    v.controls.onClick(function (e) {
      if (state.busy) return;
      var i = v.pick(e.clientX, e.clientY, 0.045);
      if (i >= 0) selectStar(i);
      else { v.select(-1); GX.hud.tooltip(null); }
    });

    var lastHover = 0;
    v.controls.onHover(function (e) {
      if (GX.stage.currentName() !== 'galaxy' || state.busy) return;
      var t = performance.now();
      if (t - lastHover < 70) return;
      lastHover = t;
      var i = v.pick(e.clientX, e.clientY, 0.03);
      v.hover(i);
      if (i < 0) { GX.hud.tooltip(null); return; }
      // cheap: classification only, no planets generated on hover
      var seed = GX.system.starSeed(i);
      var star = GX.star.classify(seed);
      var name = GX.system.name(i, seed);
      GX.hud.tooltip(
        '<b>' + name + '</b><i>' + star.className + ' · ' + Math.round(star.temperature) + ' K</i>' +
        '<u>#' + i + '</u>',
        e.clientX, e.clientY
      );
    });

    GX.bus.on('stream', function (res) {
      if (!res.center) return;
      var changed = !state.sector || state.sector.key !== res.center.key;
      state.sector = res.center;
      GX.seed.note('sector', res.center.seed, res.center.name);
      if (changed && state.view === 'galaxy') {
        GX.inspector.render();
        breadcrumb();
      }
    });
  }

  function wireKeys() {
    window.addEventListener('keydown', function (e) {
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      var k = e.key.toLowerCase();
      if (k === '`' || k === 'd') GX.devpanel.toggle();
      else if (k === 'r') randomSeed();
      else if (k === 't') cameraPreset('top');
      else if (k === 'e') cameraPreset('edge');
      else if (k === 'f') { setOverlay('factions', !state.overlays.factions); GX.controls.render(); }
      else if (k === 'g') { setOverlay('sectors', !state.overlays.sectors); GX.controls.render(); }
      else if (k === 'l') { setOverlay('trade', !state.overlays.trade); GX.controls.render(); }
      else if (k === 'escape') up();
      else if (k === '?' || k === 'h') GX.hud.help();
      else return;
      e.preventDefault();
    });
  }

  /* ---------------------------------------------------------------- boot */

  function boot() {
    state.code = GX.seed.randomCode();
    var q = applyHash();

    GX.hud.init();
    GX.stage.init(document.getElementById('gx-canvas'));

    views.galaxy = GX.stage.register('galaxy', GX.views.createGalaxy());
    views.system = GX.stage.register('system', GX.views.createSystem());
    views.planet = GX.stage.register('planet', GX.views.createPlanet());
    views.surface = GX.stage.register('surface', GX.views.createSurface());

    views.system.onPlanetClick(function (ordinal) { openPlanet(ordinal); });
    views.planet.onSurfaceClick(function (hit) { openSurface(hit.lat, hit.lon); });

    GX.controls.init();
    GX.inspector.init();
    GX.devpanel.init();
    wireGalaxyInteraction();
    wireKeys();

    document.getElementById('gx-help-btn').addEventListener('click', function () { GX.hud.help(); });
    document.getElementById('gx-dev-btn').addEventListener('click', function () { GX.devpanel.toggle(); });
    document.getElementById('gx-share-btn').addEventListener('click', copyLink);
    document.getElementById('gx-fade').classList.add('on');

    GX.stage.start();

    regenerate(function () {
      GX.stage.show('galaxy', { reset: true }).then(function () {
        breadcrumb();
        // deep link restoration: descend to whatever the URL asked for
        if (q.star !== undefined) {
          var idx = parseInt(q.star, 10);
          if (idx >= 0 && idx < state.galaxy.count) {
            selectStar(idx, false);
            if (q.planet !== undefined && q.view && q.view !== 'system') {
              openPlanet(parseInt(q.planet, 10));
              if (q.view === 'surface') {
                setTimeout(function () {
                  openSurface(parseFloat(q.lat), parseFloat(q.lon));
                }, 400);
              }
            }
          }
        }
      });
    });

    window.addEventListener('hashchange', function () {
      if (location.hash === lastWritten) return;    // our own write
      applyHash();
      GX.controls.render();
      regenerate();
    });

    if (location.search.indexOf('dev') >= 0) GX.devpanel.toggle(true);
  }

  GX.app = {
    boot: boot,
    state: function () { return state; },
    goTo: goTo,
    up: up,
    selectStar: selectStar,
    openPlanet: openPlanet,
    openSurface: openSurface,
    setSeed: setSeed,
    randomSeed: randomSeed,
    setParams: setParams,
    setOverlay: setOverlay,
    setFactionCount: setFactionCount,
    setViewOption: setViewOption,
    cameraPreset: cameraPreset,
    flyToFaction: flyToFaction,
    copyLink: copyLink,
    regenerate: regenerate,
    views: function () { return views; }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.GX = window.GX || {});

</script>
</body>
